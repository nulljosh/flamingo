<div id="map" aria-label="Map of Leonida" role="application">
  <svg id="svg" aria-hidden="true"><g id="world"></g></svg>
  <div class="layer" id="rlabels"></div>
  <div class="layer" id="plabels"></div>
  <div class="layer" id="pins"></div>
</div>

<div class="chips" id="chips" role="toolbar" aria-label="Filter the map"></div>
<div class="ctrls glass" id="ctrls">
  <button id="zin" aria-label="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button>
  <button id="zout" aria-label="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button>
  <button id="layers" aria-label="Layers: choose what shows on the map"><svg class="i"><use href="#i-layers"/></svg></button>
  <button id="fit" aria-label="Show all of Leonida"><svg class="i"><use href="#i-fit"/></svg></button>
</div>

<section id="story" class="page" aria-label="Story"><div class="wrap" id="storyBody"></div></section>
<section id="settings" class="page" aria-label="Settings"><div class="wrap" id="settingsBody"></div></section>

<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-label="Details">
  <div class="grab" id="grab"></div>
  <div class="sheet-head" id="sheetHead"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="dock">
  <nav class="tabbar glass" role="tablist" aria-label="Sections">
    <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
    <button class="tab" role="tab" id="tabMap" aria-selected="true"><svg class="i"><use href="#i-map"/></svg>Map</button>
    <button class="tab" role="tab" id="tabStory" aria-selected="false"><svg class="i"><use href="#i-story"/></svg>Story</button>
    <button class="tab" role="tab" id="tabSettings" aria-selected="false"><svg class="i"><use href="#i-settings"/></svg>Settings</button>
  </nav>
  <button class="search-btn glass" id="searchBtn" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
</div>
