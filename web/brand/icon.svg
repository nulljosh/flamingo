<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Flamingo: a white map pin over a striped Leonida sunset and teal water. Hot pink sky, no text, no game art. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset=".5" stop-color="#ff3d8b"/><stop offset="1" stop-color="#e81e74"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe07a"/><stop offset=".6" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a45"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c7d3"/><stop offset="1" stop-color="#0e8fa6"/></linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
    <mask id="stripes"><rect width="1024" height="1024" fill="#fff"/><rect y="560" width="1024" height="14" fill="#000"/><rect y="598" width="1024" height="20" fill="#000"/><rect y="642" width="1024" height="28" fill="#000"/></mask>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <circle cx="512" cy="600" r="300" fill="url(#sun)" mask="url(#stripes)"/>
    <path d="M0 700 C 170 676 340 724 512 700 S 854 676 1024 700 V 1024 H 0 Z" fill="url(#sea)"/>
    <path d="M0 760 C 170 742 340 778 512 760 S 854 742 1024 760" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="10"/>
    <ellipse cx="512" cy="842" rx="104" ry="20" fill="#06505e" opacity=".45"/>
    <path d="M512 176c-128 0-226 98-226 221 0 168 226 420 226 420s226-252 226-420c0-123-98-221-226-221z" fill="#fff"/>
    <circle cx="512" cy="397" r="86" fill="#ff3d8b"/>
  </g>
</svg>
